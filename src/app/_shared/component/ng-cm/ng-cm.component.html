<div [class.cm-fullscreen-mode]="isFullscreen()">

  <!-- Show label only when in fullscreen -->
  @if (isFullscreen() && label()) {
    <h5 class="mb-2">{{label()}}</h5>
  }

  @if (!hideControl()) {
    <!-- Sticky toolbar with background to hide scrolling text -->
    <div class="ng-cm-toolbar d-flex justify-content-start flex-wrap gap-1 p-1 sticky-top align-items-stretch" 
         style="z-index: 10; background-color: var(--bs-body-bg, #ffffff);">
      
      <button type="button" class="btn btn-outline-secondary btn-xs" title="Undo" (click)="undo()">
        <fa-icon [icon]="['fas', 'undo']" [fixedWidth]="true"></fa-icon>
      </button>
      
      <button type="button" class="btn btn-outline-secondary btn-xs" title="Search" (click)="openSearch()">
        <fa-icon [icon]="['fas', 'search']" [fixedWidth]="true"></fa-icon>
      </button>
      
      <button type="button" class="btn btn-outline-secondary btn-xs" title="Unfold All" (click)="unfoldAll()">
        <fa-icon [icon]="['far', 'plus-square']" [fixedWidth]="true"></fa-icon> Unfold
      </button>
      
      <div ngbDropdown display="static" class="d-flex dropdown position-relative">
        
        <button type="button" class="btn btn-outline-secondary btn-xs d-inline-flex align-items-center" id="dropdownFold" ngbDropdownToggle title="Fold Options">
          <fa-icon [icon]="['far', 'minus-square']" [fixedWidth]="true" class="me-1"></fa-icon> Fold
        </button>

        <div ngbDropdownMenu aria-labelledby="dropdownFold">
          <button type="button" ngbDropdownItem (click)="foldAll()">
            <strong>Fold All</strong>
          </button>
          <div class="dropdown-divider"></div>
          <button type="button" ngbDropdownItem (click)="foldLevel(1)">Level 1 (Root)</button>
          <button type="button" ngbDropdownItem (click)="foldLevel(2)">Level 2</button>
          <button type="button" ngbDropdownItem (click)="foldLevel(3)">Level 3</button>
          <button type="button" ngbDropdownItem (click)="foldLevel(4)">Level 4</button>
          <button type="button" ngbDropdownItem (click)="foldLevel(5)">Level 5</button>
        </div>
      </div>
      
      <button type="button" class="btn btn-outline-secondary btn-xs" title="Format Code" (click)="formatCode()" [disabled]="readOnly()">
        <fa-icon [icon]="['fas', 'align-left']" [fixedWidth]="true"></fa-icon> Format
      </button>

      <!-- FULLSCREEN BUTTON -->
      <button type="button" class="btn btn-outline-secondary btn-xs ms-auto" 
              title="{{ isFullscreen() ? 'Exit Fullscreen' : 'Fullscreen' }}" 
              (click)="toggleFullscreen()">
        <fa-icon [icon]="['fas', isFullscreen() ? 'compress' : 'expand']" [fixedWidth]="true"></fa-icon>
      </button>
    </div>
  }
  
  <div #codemirrorhost class="codemirrorhost"></div>
  
  @if (!skipCheck() && codeStatus()) {
    <div class="text-white small p-1 bg-danger mt-1">{{codeStatus()}}</div>
  }
  
  @if (isAssignmentError()) {
    <div class="text-white small p-1 bg-danger mt-1">Value assignment is not allowed here</div>
  }
</div>
