<div class="sidebar-heading">
      <h5 class="m-0">Cogna Manager</h5>
      <div class="filter-wrap position-relative mt-2">
        <fa-icon [icon]="['fas','filter']" aria-hidden="true"></fa-icon>
        <input type="search" class="ui-filter w-100" placeholder="Filter list" aria-label="Filter list" autocapitalize="none"
        (keyup.enter)="loadCognaList(1)" [(ngModel)]="searchText">
      </div>
    </div>
    <div class="group-list">
      @if (itemLoading()) {
      <div class="p-3 text-center">
        <div class="lds-ellipsis">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
      }@else {
      <div class="mb-3">
        @for (a of cognaList() | filter:searchText(); track a.id) {
        <a class="pointer element" [routerLink]="['/design',appId(),'cogna']" [queryParams]="{id:a?.id}"
          routerLinkActive="active" [routerLinkActiveOptions]="itemMatchOptions">
          <div class="list-group-item-heading sidebar-item-title">
            <span class="text-truncate" title="{{a.name}}">{{a.name}}</span> 
            <span class="ui-item-id" title="Click to copy ID" (click)="copyId($event, a?.id)">#{{a?.id}}</span>
          </div>
          @if (a.description) {
          <div class="list-group-item-text text-body-secondary">{{a.description}}</div>
          }
        </a>
        }
        <a class="pointer element"
          (click)="createCogna()"
          [class.disabled]="offline() || timeWarping()">
          <fa-icon [icon]="['fas','plus']" [fixedWidth]="true"></fa-icon>
          Create Cogna
        </a>
        <div class="p-2 pagination-rounded">
          @if (cognaTotal()>itemsPerPage) {
          <ngb-pagination [collectionSize]="cognaTotal()" [pageSize]="itemsPerPage" [(page)]="pageNumber" [maxSize]="5"
            (pageChange)="loadCognaList(pageNumber())" [boundaryLinks]="false" [directionLinks]="false">
            <ng-template ngbPaginationFirst>
              <fa-icon [icon]="['fas','angle-double-left']"></fa-icon>
            </ng-template>
            <ng-template ngbPaginationPrevious>
              <fa-icon [icon]="['fas','chevron-left']"></fa-icon>
            </ng-template>
            <ng-template ngbPaginationNext>
              <fa-icon [icon]="['fas','chevron-right']"></fa-icon>
            </ng-template>
            <ng-template ngbPaginationLast>
              <fa-icon [icon]="['fas','angle-double-right']"></fa-icon>
            </ng-template>
          </ngb-pagination>
          }
          <div class="clearfix"></div>
        </div>
      </div>
      }
    </div>
